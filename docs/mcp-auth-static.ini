# Verify a fixed set of bearer tokens
# (fastmcp.server.auth.providers.jwt.StaticTokenVerifier).
#
# WARNING: the tokens are stored in plain text.  This method is intended for
# development and testing only.  Never use it in production.

[server]
host = 127.0.0.1
port = 8000

[auth]
method = static

[static]
# Scopes that every token must carry.
required_scopes = setools:read

# Each [static.token.<token>] subsection defines one accepted bearer token.
# The section name after the "static.token." prefix is the literal token value
# sent in the Authorization: Bearer header.  The options are the token claims;
# "scopes" is comma-separated and all other claims are passed through as
# strings.
[static.token.dev-analyst-token]
client_id = analyst@example.com
scopes = setools:read, setools:analyze

[static.token.dev-guest-token]
client_id = guest
scopes = setools:read
