# Verify JWT bearer tokens issued by an external authentication system
# (fastmcp.server.auth.providers.jwt.JWTVerifier).

[server]
host = 127.0.0.1
port = 8000

[auth]
method = jwt

[jwt]
# Exactly one key source is required: jwks_uri, public_key, or public_key_file.
#
# A JWKS endpoint is preferred in production, as it supports key rotation
# without changing this file.
jwks_uri = https://auth.example.com/.well-known/jwks.json

# A PEM-encoded public key may be given inline.  Continuation lines must be
# indented.  Despite the name, this option also accepts the shared secret when
# an HMAC algorithm (HS256/HS384/HS512) is used.
#public_key = -----BEGIN PUBLIC KEY-----
#    MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA...
#    -----END PUBLIC KEY-----

# Alternatively, read the PEM-encoded public key from a file.
#public_key_file = /etc/setools/mcp-jwt-public-key.pem

# Reject tokens that were not issued by this issuer.  A comma-separated list
# accepts tokens from any of the listed issuers.
issuer = https://auth.example.com

# Reject tokens that are not intended for this server.  A comma-separated list
# accepts any of the listed audiences.
audience = setools-mcp

# Signature algorithm, if the issuer does not use the default RS256.
#algorithm = ES256

# Scopes that every token must carry.
required_scopes = setools:read

# Public base URL of this server, used to build the OAuth metadata endpoints.
#base_url = https://setools.example.com
