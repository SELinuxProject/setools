# Accept any non-empty bearer token without validating it
# (fastmcp.server.auth.providers.debug.DebugTokenVerifier).
#
# WARNING: this bypasses all token validation.  Only use it in a controlled
# development or test environment, or when an upstream service performs the
# actual validation.  The custom "validate" callable supported by the FastMCP
# API cannot be expressed in this file, so every non-empty token is accepted.

[server]
host = 127.0.0.1
port = 8000

[auth]
method = debug

[debug]
# Client identity reported for every accepted token.
client_id = debug-client

# Scopes granted to every accepted token.
scopes = setools:read, setools:analyze

# Scopes that every token must carry.
required_scopes = setools:read
