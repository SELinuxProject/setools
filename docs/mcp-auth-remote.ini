# Verify tokens and advertise OAuth 2.0 protected resource metadata
# (fastmcp.server.auth.RemoteAuthProvider).
#
# Use this with identity providers that support dynamic client registration
# (DCR), such as WorkOS AuthKit or Descope.  MCP clients read the advertised
# metadata to discover where to obtain a token.

[server]
host = 127.0.0.1
port = 8000

[auth]
method = remote

[remote]
# Token verifier to use.  One of: jwt, static, debug, introspection.  It is
# configured in the section of the same name, below.
token_verifier = jwt

# Authorization servers that issue tokens this server accepts.  This is a
# comma-separated list.
authorization_servers = https://auth.example.com

# Public base URL of this server.
base_url = https://setools.example.com

# Optional metadata describing this protected resource.
resource_name = SETools MCP Server
#resource_documentation = https://github.com/SELinuxProject/setools

# Configuration of the token verifier selected above.
[jwt]
jwks_uri = https://auth.example.com/.well-known/jwks.json
issuer = https://auth.example.com
audience = setools-mcp
required_scopes = setools:read
