# Verify opaque bearer tokens using OAuth 2.0 token introspection (RFC 7662)
# (fastmcp.server.auth.providers.introspection.IntrospectionTokenVerifier).
#
# Every request queries the authorization server, so revoked tokens are
# rejected immediately at the cost of network latency per request.

[server]
host = 127.0.0.1
port = 8000

[auth]
method = introspection

[introspection]
# Introspection endpoint of the authorization server.
introspection_url = https://auth.example.com/oauth/introspect

# Credentials this server uses to authenticate to the introspection endpoint.
client_id = setools-mcp
client_secret = CHANGEME

# Timeout for introspection requests, in seconds.
timeout_seconds = 10

# Scopes that every token must carry.
required_scopes = setools:read

# Public base URL of this server, used to build the OAuth metadata endpoints.
#base_url = https://setools.example.com
