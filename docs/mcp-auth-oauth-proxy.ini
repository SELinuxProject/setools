# Proxy an upstream OAuth provider that does not support dynamic client
# registration (fastmcp.server.auth.OAuthProxy).
#
# The proxy presents a DCR-compliant interface to MCP clients while using this
# server's pre-registered credentials with the upstream provider.  Use this
# with providers such as GitHub, Google, or Azure.

[server]
host = 127.0.0.1
port = 8000

[auth]
method = oauth_proxy

[oauth_proxy]
# Token verifier used to validate the tokens issued by the upstream provider.
# One of: jwt, static, debug, introspection.  It is configured in the section
# of the same name, below.
token_verifier = jwt

# Upstream provider endpoints.
upstream_authorization_endpoint = https://auth.example.com/oauth/authorize
upstream_token_endpoint = https://auth.example.com/oauth/token
#upstream_revocation_endpoint = https://auth.example.com/oauth/revoke

# Credentials registered with the upstream provider.
upstream_client_id = CHANGEME
upstream_client_secret = CHANGEME

# Public base URL of this server.  The redirect URI registered with the
# upstream provider is base_url + redirect_path.
base_url = https://setools.example.com
redirect_path = /auth/callback

# Issuer URL advertised in the OAuth metadata, if it differs from base_url.
#issuer_url = https://setools.example.com
#service_documentation_url = https://github.com/SELinuxProject/setools

# Client redirect URIs accepted during dynamic client registration.  This is a
# comma-separated list of patterns; an empty value allows any URI.
allowed_client_redirect_uris = http://localhost:*, http://127.0.0.1:*

# Scopes advertised to clients.
valid_scopes = setools:read, setools:analyze

# Forward PKCE challenges to the upstream provider.
forward_pkce = true

# Client authentication method used at the upstream token endpoint, if the
# provider does not accept the default.
#token_endpoint_auth_method = client_secret_post

# Key used to sign the proxy's own authorization codes and refresh tokens.  A
# transient key is generated when this is unset, which invalidates outstanding
# authorizations on restart.
#jwt_signing_key = CHANGEME

# Present a consent screen before authorizing a dynamically registered client.
require_authorization_consent = true
#consent_csp_policy = default-src 'self'

# Assumed lifetime of upstream access tokens that have no expiry, in seconds.
#fallback_access_token_expiry_seconds = 3600

# Configuration of the token verifier selected above.
[jwt]
jwks_uri = https://auth.example.com/.well-known/jwks.json
issuer = https://auth.example.com
audience = setools-mcp
