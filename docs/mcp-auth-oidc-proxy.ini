# Proxy an OpenID Connect provider, configured from its discovery document
# (fastmcp.server.auth.OIDCProxy).
#
# This is an OAuth proxy that reads the provider's endpoints and signing keys
# from the OIDC discovery document instead of requiring them to be listed
# individually, so no separate token verifier section is needed.

[server]
host = 127.0.0.1
port = 8000

[auth]
method = oidc_proxy

[oidc_proxy]
# OIDC discovery document of the upstream provider.
config_url = https://auth.example.com/.well-known/openid-configuration

# Credentials registered with the upstream provider.
client_id = CHANGEME
client_secret = CHANGEME

# Expected audience of the tokens issued by the provider.  Defaults to
# client_id when unset.
#audience = setools-mcp

# Require the discovery document to strictly conform to the OIDC
# specification.
strict = false

# Timeout for fetching the discovery document, in seconds.
timeout_seconds = 10

# Signature algorithm, if the provider does not use the default RS256.
#algorithm = ES256

# Scopes that every token must carry.
required_scopes = openid

# Public base URL of this server.  The redirect URI registered with the
# upstream provider is base_url + redirect_path.
base_url = https://setools.example.com
redirect_path = /auth/callback

# Issuer URL advertised in the OAuth metadata, if it differs from base_url.
#issuer_url = https://setools.example.com

# Client redirect URIs accepted during dynamic client registration.  This is a
# comma-separated list of patterns; an empty value allows any URI.
allowed_client_redirect_uris = http://localhost:*, http://127.0.0.1:*

# Client authentication method used at the upstream token endpoint, if the
# provider does not accept the default.
#token_endpoint_auth_method = client_secret_post

# Present a consent screen before authorizing a dynamically registered client.
require_authorization_consent = true
#consent_csp_policy = default-src 'self'

# Assumed lifetime of upstream access tokens that have no expiry, in seconds.
#fallback_access_token_expiry_seconds = 3600
